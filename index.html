    group.icons.forEach((icon, ii) => {
      const item = document.createElement('div');
      item.className = 'icon-item' + (currentTool === icon.id ? ' active' : '');
      item.dataset.type = icon.id;
      item.style.animationDelay = (ii * 0.01) + 's';

      if (icon.noImage) {
        // 空气这类无贴图图标：用虚线空框占位，避免出现破图
        const ph = document.createElement('div');
        ph.className = 'icon-placeholder';
        item.appendChild(ph);
      } else {
        const img = document.createElement('img');
        img.src = ICONS_DIR + icon.file + ICON_EXT;
        img.alt = icon.label;
        img.onerror = () => { img.style.opacity = 0.2; };
        item.appendChild(img);
      }

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = icon.label;
      item.appendChild(name);
      item.onclick = () => { setTool(icon.id); arrowStart = null; renderGrid(); };
      grid.appendChild(item);
    });
    g.appendChild(grid);
    container.appendChild(g);
  });
}

function renderGrid() {
  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${CELL_SIZE}px)`;

  const oldSvg = gridEl.querySelector('.arrow-svg');
  if (oldSvg) oldSvg.remove();
  const oldBase = gridEl.querySelector('.baseline-svg');
  if (oldBase) oldBase.remove();
  const oldMid = gridEl.querySelector('.midcell-svg');
  if (oldMid) oldMid.remove();
  gridEl.querySelectorAll('.cell').forEach(el => el.remove());

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      gridEl.appendChild(buildCell(r, c));
    }
  }
  // 斜带层垫在最底下（先于箭头层生成，但要插到第一个格子之前）
  ensureBaseLineLayer();
  ensureMidCellLayer();
  renderArrows(gridEl);
  paintSelection();
}

/* 构建单个格子元素（全量渲染与单格增量渲染共用） */
function buildCell(r, c) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.r = r;
  cell.dataset.c = c;
  if (arrowStart && arrowStart.r === r && arrowStart.c === c) {
    cell.classList.add('arrow-start');
  }
  if (selHas(r, c)) {
    cell.classList.add('selected');
  }
  if (altStart && altStart.r === r && altStart.c === c) {
    cell.classList.add('alt-start');
  }
  cell.onclick = () => handleCellClick(r, c);
  cell.oncontextmenu = (e) => {
    e.preventDefault();
    flashEraser();
    eraserAt(r, c);
  };
  renderCellContent(cell, gridData[r][c]);
  return cell;
}

/* 只重绘一个格子：避免每次点击都重建全部 DOM（大图卡顿的主因） */
function updateCell(r, c) {
  const gridEl = document.getElementById('grid');
  const cell = gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (!cell) return;
  cell.classList.toggle('arrow-start', !!arrowStart && arrowStart.r === r && arrowStart.c === c);
  cell.classList.toggle('alt-start', !!altStart && altStart.r === r && altStart.c === c);
  renderCellContent(cell, gridData[r][c]);
}

/* 重绘格子 + 箭头层（改箭头时才需要） */
function repaintAll() {
  renderGrid();
}

/* ===== 框选 / 整体拖动 =====
   选区是一组格子（不是矩形），这样才能拖不规则的形状。
   selection = Set("r,c")，空集合视为没有选区。 */

function selKey(r, c) { return r + ',' + c; }
function parseKey(k) { const p = k.split(','); return { r: +p[0], c: +p[1] }; }

function selHas(r, c) { return selection && selection.has(selKey(r, c)); }
function selAdd(r, c) {
  if (!selection) selection = new Set();
  selection.add(selKey(r, c));
}
function selRemove(r, c) {
  if (!selection) return;
  selection.delete(selKey(r, c));
  if (selection.size === 0) selection = null;
}
function selEmpty() { return !selection || selection.size === 0; }

/* 选区的最小外接矩形，用于边界判断与区域重绘 */
function selBounds(sel) {
  sel = sel || selection;
  if (selEmpty.call(null) && !sel) return null;
  if (!sel || sel.size === 0) return null;
  let r1 = Infinity, c1 = Infinity, r2 = -Infinity, c2 = -Infinity;
  sel.forEach(k => {
    const p = parseKey(k);
    if (p.r < r1) r1 = p.r;
    if (p.c < c1) c1 = p.c;
    if (p.r > r2) r2 = p.r;
    if (p.c > c2) c2 = p.c;
  });
  return { r1, c1, r2, c2 };
}

/* 把外接矩形范围内的格子收集成集合 */
function rectToSet(r1, c1, r2, c2) {
  const s = new Set();
  for (let r = Math.min(r1,r2); r <= Math.max(r1,r2); r++)
    for (let c = Math.min(c1,c2); c <= Math.max(c1,c2); c++)
      s.add(selKey(r, c));
  return s;
}

function normRect(r1, c1, r2, c2) {
  return { r1: Math.min(r1,r2), c1: Math.min(c1,c2), r2: Math.max(r1,r2), c2: Math.max(c1,c2) };
}
function inRect(rect, r, c) {
  return rect && r >= rect.r1 && r <= rect.r2 && c >= rect.c1 && c <= rect.c2;
}
function rectSize(rect) {
  return { h: rect.r2 - rect.r1 + 1, w: rect.c2 - rect.c1 + 1 };
}

/* 重画箭头层（先清掉旧的，避免叠加） */
function repaintArrows() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return;
  const old = gridEl.querySelector('.arrow-svg');
  if (old) old.remove();
  renderArrows(gridEl);
}

/* 把选中态刷到格子上（只改 class，避免整图重建） */
function paintSelection() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return;
  gridEl.querySelectorAll('.cell').forEach(el => {
    const r = +el.dataset.r, c = +el.dataset.c;
    el.classList.toggle('selected', selHas(r, c));
  });
  gridEl.classList.toggle('can-drag', !selEmpty());
}

function clearSelection() {
  selection = null;
  marquee = null;
  dragState = null;
  paintSelection();
}

function updateMarqueeEl() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return;
  let el = gridEl.querySelector('.marquee');
  if (!marquee) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.className = 'marquee'; gridEl.appendChild(el); }
  const step = CELL_SIZE + GAP;
  const rect = normRect(marquee.r1, marquee.c1, marquee.r2, marquee.c2);
  el.style.left = (rect.c1 * step) + 'px';
  el.style.top = (rect.r1 * step) + 'px';
  el.style.width = ((rect.c2 - rect.c1 + 1) * CELL_SIZE + (rect.c2 - rect.c1) * GAP) + 'px';
  el.style.height = ((rect.r2 - rect.r1 + 1) * CELL_SIZE + (rect.r2 - rect.r1) * GAP) + 'px';
}

/* 从像素坐标反推格坐标 */
function pointToCell(clientX, clientY) {
  const gridEl = document.getElementById('grid');
  const rect = gridEl.getBoundingClientRect();
  const step = CELL_SIZE + GAP;
  const c = Math.floor((clientX - rect.left) / step);
  const r = Math.floor((clientY - rect.top) / step);
  return {
    r: Math.max(0, Math.min(rows - 1, r)),
    c: Math.max(0, Math.min(cols - 1, c))
  };
}

/* 从像素坐标找浮动格（命中返回该浮动格信息，否则 null） */
function pointToMidCell(clientX, clientY) {
  const gridEl = document.getElementById('grid');
  const rect = gridEl.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  const mids = baseLineMidCells();
  for (const m of mids) {
    if (px >= m.x && px <= m.x + m.w && py >= m.y && py <= m.y + m.h) return m;
  }
  return null;
}

/* 只重绘两个矩形范围（拖动时用，避免全图重建） */
function repaintRegion(rect) {
  for (let r = rect.r1; r <= rect.r2; r++) {
    for (let c = rect.c1; c <= rect.c2; c++) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
      updateCell(r, c);
    }
  }
}

/* ===== Alt 连线铺底板（矢量斜带）===== */

/* 格中心 → 网格像素坐标（与 renderArrows 用同一套 step 计算） */
function cellCenterPx(r, c) {
  const step = CELL_SIZE + GAP;
  return {
    x: c * step + CELL_SIZE / 2,
    y: r * step + CELL_SIZE / 2
  };
}

/* 格中心到斜带中心线的距离（用于判断覆盖） */
function distToLine(line, r, c) {
  const p = cellCenterPx(r, c);
  const a = cellCenterPx(line.r1, line.c1);
  const b = cellCenterPx(line.r2, line.c2);

  const vx = b.x - a.x, vy = b.y - a.y;
  const wx = p.x - a.x, wy = p.y - a.y;
  const len2 = vx * vx + vy * vy;

  let t = len2 === 0 ? 0 : (wx * vx + wy * vy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = a.x + t * vx, cy = a.y + t * vy;
  return Math.hypot(p.x - cx, p.y - cy);
}

/* 该格是否被任何斜带盖住（盖住就不能放图标）
   判定：格中心落在带子宽度内，即距离 < 半格 */
function isCellCoveredByLine(r, c) {
  for (const line of baseLines) {
    if (distToLine(line, r, c) < CELL_SIZE / 2) return true;
  }
  return false;
}

/* ===== 斜带的浮动中点格 =====
   位置：A、B 两格心的几何中点；正着放（不旋转），边长一格。
   它由斜带唯一确定，所以不单独存储，每次实时算。 */
function baseLineMidCells() {
  const step = CELL_SIZE + GAP;
  const out = [];
  baseLines.forEach((line, idx) => {
    if (line.r1 === line.r2 && line.c1 === line.c2) return;
    const a = cellCenterPx(line.r1, line.c1);
    const b = cellCenterPx(line.r2, line.c2);
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    out.push({
      lineIndex: idx,
      line,
      // 浮动格矩形（左上角 + 尺寸）
      x: mx - CELL_SIZE / 2,
      y: my - CELL_SIZE / 2,
      w: CELL_SIZE,
      h: CELL_SIZE,
      cx: mx, cy: my,
      value: line.value
    });
  });
  return out;
}

/* 某格是否被任何浮动格"碰到"（碰到就不能放图标） */
function isCellTouchedByMid(midCells, r, c) {
  const step = CELL_SIZE + GAP;
  const x0 = c * step, y0 = r * step;
  const x1 = x0 + CELL_SIZE, y1 = y0 + CELL_SIZE;
  for (const m of midCells) {
    // 两个矩形是否有交集
    if (m.x < x1 && m.x + m.w > x0 && m.y < y1 && m.y + m.h > y0) return true;
  }
  return false;
}

/* 该格能否放图标？
   只有【被浮动格碰到】的原格不能放（最多 4 个）。
   斜带压过的格子照常能放（斜带只是底板）。 */
function canPlaceIcon(r, c) {
  return !isCellTouchedByMid(baseLineMidCells(), r, c);
}

/* 斜带层的 SVG（垫在所有格子/图标下方） */
function ensureBaseLineLayer() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return null;

  const step = CELL_SIZE + GAP;
  const w = cols * CELL_SIZE + (cols - 1) * GAP;
  const h = rows * CELL_SIZE + (rows - 1) * GAP;

  let svg = gridEl.querySelector('.baseline-svg');
  if (!svg) {
    const ns = 'http://www.w3.org/2000/svg';
    svg = document.createElementNS(ns, 'svg');
    svg.classList.add('baseline-svg');
    const firstCell = gridEl.querySelector('.cell');
    if (firstCell) gridEl.insertBefore(svg, firstCell);
    else gridEl.appendChild(svg);
  }
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const ns = 'http://www.w3.org/2000/svg';

  // ---- 1. 白色底：格子是透明的，空白处靠它显示为白 ----
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('x', 0);
  bg.setAttribute('y', 0);
  bg.setAttribute('width', w);
  bg.setAttribute('height', h);
  bg.setAttribute('fill', '#ffffff');
  svg.appendChild(bg);

  // ---- 2. 网格线：垫在最底层（白底之上、斜带之下）----
  const gridColor = '#dddddd';
  function gridLine(x1, y1, x2, y2) {
    const ln = document.createElementNS(ns, 'line');
    ln.setAttribute('x1', x1);
    ln.setAttribute('y1', y1);
    ln.setAttribute('x2', x2);
    ln.setAttribute('y2', y2);
    ln.setAttribute('stroke', gridColor);
    ln.setAttribute('stroke-width', GAP);
    svg.appendChild(ln);
  }
  for (let r = 1; r < rows; r++) {
    const y = r * step - GAP / 2;
    gridLine(0, y, w, y);
  }
  for (let c = 1; c < cols; c++) {
    const x = c * step - GAP / 2;
    gridLine(x, 0, x, h);
  }

  // ---- 3. 斜带：取两个格子的凸包 ----
  //   两个格子各是一个正方形，它们的凸包正好是"两端为完整格边、
  //   中间平滑过渡"的形状，且必然填满两个格子。
  //   （水平/垂直时就是一个长方形；斜向时是一个六边形。）
  baseLines.forEach(line => {
    const x0 = line.c1 * step, y0 = line.r1 * step;
    const x1 = line.c2 * step, y1 = line.r2 * step;

    if (line.r1 === line.r2 && line.c1 === line.c2) return;   // 同一格：不画

    const pts = [
      [x0, y0], [x0 + CELL_SIZE, y0],
      [x0 + CELL_SIZE, y0 + CELL_SIZE], [x0, y0 + CELL_SIZE],
      [x1, y1], [x1 + CELL_SIZE, y1],
      [x1 + CELL_SIZE, y1 + CELL_SIZE], [x1, y1 + CELL_SIZE]
    ];

    // Andrew 单调链凸包
    const hull = (list) => {
      const p = list.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const cross = (o, a, b) =>
        (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const lower = [], upper = [];
      for (const q of p) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
        lower.push(q);
      }
      for (let i = p.length - 1; i >= 0; i--) {
        const q = p[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
        upper.push(q);
      }
      lower.pop(); upper.pop();
      return lower.concat(upper);
    };

    const ring = hull(pts);
    if (ring.length < 3) return;

    const v = Math.round(255 * (1 - line.value / 100));
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('points', ring.map(p => p[0] + ',' + p[1]).join(' '));
    poly.setAttribute('fill', 'rgb(' + v + ',' + v + ',' + v + ')');
    svg.appendChild(poly);
  });

  return svg;
}

/* 浮动格层：单独一个 SVG，垫在斜带之上、格子之下。
   用 2px 描边画出"这里有个可用格子"的提示感，但平时不抢眼。 */
function ensureMidCellLayer() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return null;

  const step = CELL_SIZE + GAP;
  const w = cols * CELL_SIZE + (cols - 1) * GAP;
  const h = rows * CELL_SIZE + (rows - 1) * GAP;

  let svg = gridEl.querySelector('.midcell-svg');
  if (!svg) {
    const ns = 'http://www.w3.org/2000/svg';
    svg = document.createElementNS(ns, 'svg');
    svg.classList.add('midcell-svg');
    gridEl.appendChild(svg);
  }
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const ns = 'http://www.w3.org/2000/svg';
  baseLineMidCells().forEach((m) => {
    const g = document.createElementNS(ns, 'g');
    g.classList.add('mid-cell');
    g.dataset.midIndex = m.lineIndex;

    const rect = document.createElementNS(ns, 'rect');
    rect.classList.add('mid-hit');
    rect.setAttribute('x', m.x);
    rect.setAttribute('y', m.y);
    rect.setAttribute('width', m.w);
    rect.setAttribute('height', m.h);
    rect.setAttribute('fill', 'transparent');
    g.appendChild(rect);

    // 浮动格里的内容（图标 / 底板）
    const content = midCells[m.lineIndex];
    if (content) {
      if (content.base !== null && content.base !== undefined) {
        const v = Math.round(255 * (1 - content.base / 100));
        const bg = document.createElementNS(ns, 'rect');
        bg.setAttribute('x', m.x);
        bg.setAttribute('y', m.y);
        bg.setAttribute('width', m.w);
        bg.setAttribute('height', m.h);
        bg.setAttribute('fill', 'rgb(' + v + ',' + v + ',' + v + ')');
        g.appendChild(bg);
      }
      if (content.ground && content.ground !== 'empty' && !NO_IMAGE_ICONS.has(content.ground)) {
        const file = ICON_FILE_MAP[content.ground];
        if (file) {
          const im = document.createElementNS(ns, 'image');
          im.setAttribute('x', m.x);
          im.setAttribute('y', m.y);
          im.setAttribute('width', m.w);
          im.setAttribute('height', m.h);
          im.setAttributeNS('http://www.w3.org/1999/xlink', 'href', ICONS_DIR + file + ICON_EXT);
          g.appendChild(im);
        }
      }
    }

    svg.appendChild(g);
  });
  return svg;
}

function repaintBaseLines() {
  ensureBaseLineLayer();
}

/* 校验并归一化从外部读入的斜带（防止坏数据把渲染搞崩） */
function normalizeBaseLines(src) {
  if (!Array.isArray(src)) return [];
  const out = [];
  src.forEach(l => {
    if (!l || typeof l !== 'object') return;
    const r1 = +l.r1, c1 = +l.c1, r2 = +l.r2, c2 = +l.c2;
    if (![r1, c1, r2, c2].every(Number.isInteger)) return;
    if (r1 < 0 || c1 < 0 || r2 < 0 || c2 < 0) return;
    if (r1 >= rows || r2 >= rows || c1 >= cols || c2 >= cols) return;
    let v = +l.value;
    if (!isFinite(v)) v = 60;
    v = Math.max(0, Math.min(100, Math.round(v)));
    out.push({ r1, c1, r2, c2, value: v });
  });
  return out;
}

/* Alt + 左键单击：第一次记起点，第二次画斜带 */
function altClick(r, c) {
  const baseValue = +document.getElementById('baseLevel').value;

  // 第一次点：记起点并高亮
  if (!altStart) {
    altStart = { r, c };
    updateCell(r, c);
    document.getElementById('baseEnable').checked = true;
    return;
  }

  // 第二次点：同格 → 零长度斜带没有意义，忽略
  if (altStart.r === r && altStart.c === c) {
    altStart = null;
    repaintAll();
    return;
  }

  // 第二次点：记下这条斜带
  baseLines.push({
    r1: altStart.r, c1: altStart.c,
    r2: r, c2: c,
    value: baseValue
  });

  altStart = null;          // 画完自动重置，Alt 按着可连续画
  pushHistory();
  repaintAll();
}

/* 松开 Alt：斜带需要两个点，只点了一个就丢弃 */
function cancelAltStart(commit) {
  if (!altStart) return;
  altStart = null;
  repaintAll();
}

/* ===== 浮动格的操作 ===== */
function handleMidCellClick(mid) {
  const idx = mid.lineIndex;

  // 橡皮擦：清掉浮动格里的内容
  if (eraserOn || currentTool === 'eraser') {
    if (midCells[idx]) {
      delete midCells[idx];
      pushHistory();
      repaintAll();
    }
    return;
  }

  // 箭头层：浮动格也可以作为箭头的起点/终点
  if (currentLayer === 'arrow') {
    if (!currentTool.startsWith('arrow-')) return;
    // 浮动格暂不支持箭头（它不在 gridData 里），给出提示
    showToast('浮动格暂不支持箭头', 1800);
    return;
  }

  if (currentTool.startsWith('arrow-')) return;

  // 放图标
  const cur = midCells[idx] || { ground: 'empty', base: null };
  if (cur.ground === currentTool) return;

  cur.ground = currentTool;
  if (document.getElementById('baseEnable').checked) {
    cur.base = +document.getElementById('baseLevel').value;
  }
  midCells[idx] = cur;
  pushHistory();
  repaintAll();
}

/* 移动选中区域：剪切 + 整体平移；越界的箭头删除。
   支持任意形状（选区是格子集合）。 */
function moveSelection(dr, dc) {
  if (selEmpty()) return;
  const oldBounds = selBounds();

  // 先取出所有选中格的内容快照
  const snapshot = [];
  selection.forEach(k => {
    const p = parseKey(k);
    const src = gridData[p.r][p.c];
    snapshot.push({
      r: p.r, c: p.c,
      ground: src.ground,
      base: src.base,
      arrows: (src.arrows || []).map(a => ({ color: a.color, toR: a.toR + dr, toC: a.toC + dc }))
    });
  });

  // 1. 清空所有原位置
  snapshot.forEach(item => {
    gridData[item.r][item.c] = { ground: 'empty', base: null, arrows: [] };
    delete groundOverflow[cellKey(item.r, item.c)];
  });

  // 2. 写入新位置；终点越界的箭头丢弃
  const newSet = new Set();
  snapshot.forEach(item => {
    const rr = item.r + dr, cc = item.c + dc;
    if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) return;
    const kept = item.arrows.filter(a =>
      a.toR >= 0 && a.toR < rows && a.toC >= 0 && a.toC < cols
    );
    gridData[rr][cc] = { ground: item.ground, base: item.base, arrows: kept };
    if (item.ground !== 'empty' || item.base !== null) {
      groundOverflow[cellKey(rr, cc)] = { ground: item.ground, base: item.base };
    }
    newSet.add(selKey(rr, cc));
  });

  // 3. 选区跟着走
  selection = newSet.size ? newSet : null;
  rebuildArrowIndex();

  return { oldBounds, newBounds: selBounds() };
}

/* 能否整体移动：按外接矩形判断，整个外框都不出界才允许 */
function canMoveSelection(dr, dc) {
  const b = selBounds();
  if (!b) return false;
  return b.r1 + dr >= 0 && b.r2 + dr <= rows - 1
      && b.c1 + dc >= 0 && b.c2 + dc <= cols - 1;
}

/* 整个地图上绑定的鼠标逻辑（框选 / 点选 / 拖动） */
const LONG_PRESS_MS = 280;      // 长按多久算"拿起"

function initSelectionDrag() {
  const gridEl = document.getElementById('grid');

  let pressTimer = null;        // 长按计时器
  let pendingPress = null;      // { r, c, x, y } 等待判定是点击还是长按

  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    pendingPress = null;
  }

  function beginDrag(r, c, mode) {
    // mode: 'selection' 拖整个选区 / 'single' 拖单格
    dragState = {
      mode,
      startR: r, startC: c,
      lastR: r, lastC: c,
      moved: false,
      singleSnapshot: null
    };
    if (mode === 'single') {
      // 单格：临时把这一格当作选区来移动
      const src = gridData[r][c];
      dragState.singleSnapshot = {
        ground: src.ground,
        base: src.base,
        arrows: (src.arrows || []).map(a => ({ color: a.color, toR: a.toR, toC: a.toC }))
      };
      // 用只含这一格的集合来复用 moveSelection
      savedSelectionForSingle = selection;
      selection = new Set([selKey(r, c)]);
      paintSelection();
    }
    gridEl.classList.add('dragging');
  }

  gridEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const p = pointToCell(e.clientX, e.clientY);

    // --- 点在浮动格上：交给浮动格处理 ---
    const mid = pointToMidCell(e.clientX, e.clientY);
    if (mid && !e.altKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      e.stopPropagation();
      handleMidCellClick(mid);
      suppressClick = true;
      return;
    }

    // --- Alt + 左键：连线铺底板（最高优先级）---
    if (e.altKey) {
      e.preventDefault();
      e.stopPropagation();
      altClick(p.r, p.c);
      suppressClick = true;
      return;
    }

    // --- Ctrl + 左键：开始拉框（松手后才判定）---
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      marquee = { r1: p.r, c1: p.c, r2: p.r, c2: p.c, additive: !selEmpty() };
      updateMarqueeEl();
      return;
    }

    // --- 已有选区且点在选区内：直接拖整个选区 ---
    if (!selEmpty() && selHas(p.r, p.c)) {
      e.preventDefault();
      beginDrag(p.r, p.c, 'selection');
      return;
    }

    // --- 其余情况：等一等，看是"单击画图"还是"长按拖动单格" ---
    pendingPress = { r: p.r, c: p.c };
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (!pendingPress) return;
      beginDrag(pendingPress.r, pendingPress.c, 'single');
      pendingPress = null;
    }, LONG_PRESS_MS);
  });

  window.addEventListener('mousemove', (e) => {
    // 拉框中
    if (marquee) {
      const p = pointToCell(e.clientX, e.clientY);
      marquee.r2 = p.r; marquee.c2 = p.c;
      updateMarqueeEl();
      return;
    }
    // 拖动中
    if (dragState) {
      const p = pointToCell(e.clientX, e.clientY);
      let dr = p.r - dragState.lastR;
      let dc = p.c - dragState.lastC;
      if (dr === 0 && dc === 0) return;

      // 边界卡住：整个外接矩形能放下才移动
      if (!canMoveSelection(dr, dc)) {
        // 尝试单轴
        if (canMoveSelection(dr, 0)) dc = 0;
        else if (canMoveSelection(0, dc)) dr = 0;
        else return;
      }
      if (dr === 0 && dc === 0) return;

      const res = moveSelection(dr, dc);
      dragState.lastR = p.r;
      dragState.lastC = p.c;
      dragState.moved = true;

      if (res) {
        repaintRegion(res.oldBounds);
        repaintRegion(res.newBounds);
      }
      paintSelection();
      repaintArrows();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0) return;
    cancelPress();

    // 结束拉框
    if (marquee) {
      const rect = normRect(marquee.r1, marquee.c1, marquee.r2, marquee.c2);
      const additive = marquee.additive;
      marquee = null;
      updateMarqueeEl();
      const { h, w } = rectSize(rect);

      if (h === 1 && w === 1) {
        // Ctrl + 左键"单击"：切换这一格的选中状态
        const r = rect.r1, c = rect.c1;
        if (selHas(r, c)) selRemove(r, c);
        else selAdd(r, c);
      } else {
        const set = rectToSet(rect.r1, rect.c1, rect.r2, rect.c2);
        if (additive) {
          if (!selection) selection = new Set();
          set.forEach(k => selection.add(k));
        } else {
          selection = set;
        }
      }
      if (selEmpty()) selection = null;
      paintSelection();
      suppressClick = true;
      return;
    }

    // 结束拖动
    if (dragState) {
      const wasMoved = dragState.moved;
      const mode = dragState.mode;
      dragState = null;
      gridEl.classList.remove('dragging');

      if (mode === 'single') {
        // 单格拖动结束：恢复原来的选区
        selection = savedSelectionForSingle;
        savedSelectionForSingle = null;
        paintSelection();
      }
      if (wasMoved) {
        pushHistory();
        suppressClick = true;
      }
    }
  });

  // 左键单击：吃掉"拖完那一下"的误触
  gridEl.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
  }, true);

  // 右键：
  //   Ctrl + 右键选区内 -> 把这一格移出选区
  //   普通右键选区内   -> 解散整个选区
  //   其余             -> 原来的右键擦除
  gridEl.addEventListener('contextmenu', (e) => {
    if (marquee || dragState) {
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (selEmpty()) return;              // 没选区 -> 走擦除
    const p = pointToCell(e.clientX, e.clientY);
    if (!selHas(p.r, p.c)) return;       // 点在选区外 -> 走擦除

    e.preventDefault(); e.stopPropagation();
    if (e.ctrlKey || e.metaKey) {
      selRemove(p.r, p.c);
      paintSelection();
      if (selEmpty()) showToast('已取消选择');
    } else {
      clearSelection();
      showToast('已取消选择');
    }
  }, true);
}


/* ===== 橡皮擦：两段式 ===== */
function eraserAt(r, c) {
  let changed = false;

  // ---- 第一段：删掉所有指向该格的箭头（入向）----
  const incoming = arrowIndex.get(cellKey(r, c));
  if (incoming && incoming.length > 0) {
    const targets = incoming.slice();
    targets.forEach(entry => {
      const src = gridData[entry.r][entry.c];
      const i = src.arrows.indexOf(entry.arrow);
      if (i !== -1) src.arrows.splice(i, 1);
    });
    arrowIndex.delete(cellKey(r, c));
    changed = true;
    pushHistory();
    repaintAll();
    return;
  }

  // ---- 第二段：擦掉经过该格的斜带 ----
  //   判定：格心到斜带中心线的距离小于半格
  const hitLines = [];
  baseLines.forEach((line, idx) => {
    if (distToLine(line, r, c) < CELL_SIZE / 2) hitLines.push(idx);
  });
  if (hitLines.length > 0) {
    // 从后往前删，避免下标错位
    hitLines.slice().reverse().forEach(idx => baseLines.splice(idx, 1));
    // 浮动格内容按老下标存，删完要重排
    rebuildMidCellsAfterLineDelete(hitLines);
    changed = true;
    pushHistory();
    repaintAll();
    return;
  }

  // ---- 第三段：擦掉格子本身（图标 / 底板 / 出向箭头）----
  const cell = gridData[r][c];
  const hadSomething = (cell.ground && cell.ground !== 'empty')
    || (cell.base !== null && cell.base !== undefined)
    || (cell.arrows && cell.arrows.length > 0);   // 光有箭头也算"有东西"

  if (cell.arrows && cell.arrows.length > 0) {
    cell.arrows.slice().forEach(a => indexRemoveArrow(r, c, a));
  }

  cell.ground = 'empty';
  cell.base = null;
  cell.arrows = [];
  delete groundOverflow[cellKey(r, c)];

  if (!hadSomething) return;   // 本来就是空格，不必记历史
  pushHistory();
  repaintAll();
}

/* 删除若干条斜带后，重建浮动格内容的键（避免错位） */
function rebuildMidCellsAfterLineDelete(deletedIdx) {
  const next = {};
  Object.keys(midCells).forEach(k => {
    const old = +k;
    const shift = deletedIdx.filter(d => d < old).length;
    if (deletedIdx.indexOf(old) !== -1) return;   // 这条斜带没了，内容丢弃
    next[old - shift] = midCells[k];
  });
  midCells = next;
}

function flashEraser() {
  const btn = document.getElementById('leftEraserBtn');
  btn.classList.add('active');
  setTimeout(() => {
    // 开关本身是开着的就一直保持高亮，否则闪烁一下即收回
    if (!eraserOn && currentTool !== 'eraser') {
      btn.classList.remove('active');
    }
  }, 180);
}

/* 橡皮擦开关：左键切换开/关，除此之外什么都不改 */
function toggleEraser() {
  eraserOn = !eraserOn;
  updateEraserUI();
}

function updateEraserUI() {
  const btn = document.getElementById('leftEraserBtn');
  if (!btn) return;
  btn.classList.toggle('active', eraserOn);
  btn.setAttribute('aria-pressed', eraserOn ? 'true' : 'false');
  btn.title = eraserOn ? '橡皮擦：已开启（点击关闭）' : '橡皮擦：已关闭（点击开启）';
}

function renderCellContent(cellEl, data) {
  cellEl.innerHTML = '';

  if (data.base !== null && data.base !== undefined) {
    const base = document.createElement('div');
    base.className = 'base-block';
    const v = Math.round(255 * (1 - data.base / 100));
    base.style.background = `rgb(${v},${v},${v})`;
    cellEl.appendChild(base);
  }

  if (data.ground && data.ground !== 'empty') {
    // "空气"这类无贴图图标：只保留底板，不画图
    if (!NO_IMAGE_ICONS.has(data.ground)) {
      const file = ICON_FILE_MAP[data.ground];
      if (file) {
        const img = document.createElement('img');
        img.className = 'icon-img';
        img.src = ICONS_DIR + file + ICON_EXT;
        img.alt = data.ground;
        cellEl.appendChild(img);
      }
    }
  }
}

function renderArrows(gridEl) {
  const step = CELL_SIZE + GAP;
  const totalW = cols * CELL_SIZE + (cols - 1) * GAP;
  const totalH = rows * CELL_SIZE + (rows - 1) * GAP;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.classList.add('arrow-svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.style.width = totalW + 'px';
  svg.style.height = totalH + 'px';

  const colors = {
    'arrow-red': '#e53935', 'arrow-blue': '#1e88e5',
    'arrow-green': '#43a047', 'arrow-yellow': '#fbc02d'
  };
  const { lineWidth, headLen, headWidth } = ARROW_STYLE;

  const arrowAlpha = document.getElementById('exportArrowAlpha').checked ? 0.85 : 1;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const data = gridData[r][c];
      if (!data.arrows || data.arrows.length === 0) continue;
      const cx = c * step + CELL_SIZE / 2;
      const cy = r * step + CELL_SIZE / 2;
      data.arrows.forEach(arrow => {
        const color = colors[arrow.color];
        if (!color) return;
        const tr = arrow.toR, tc = arrow.toC;
        if (tr === undefined || tc === undefined) return;
        const tx = tc * step + CELL_SIZE / 2;
        const ty = tr * step + CELL_SIZE / 2;
        const dx = tx - cx, dy = ty - cy;
        const dist = Math.hypot(dx, dy);
        if (dist < 1) return;
        const ux = dx / dist, uy = dy / dist;
        const lineEndX = tx - ux * (headLen * 0.5);
        const lineEndY = ty - uy * (headLen * 0.5);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', lineEndX);
        line.setAttribute('y2', lineEndY);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', lineWidth);
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('opacity', arrowAlpha);
        svg.appendChild(line);
        const baseX = tx - ux * headLen;
        const baseY = ty - uy * headLen;
        const px = -uy, py = ux;
        const head = document.createElementNS(svgNS, 'polygon');
        head.setAttribute('points',
          `${tx},${ty} ` +
          `${baseX + px * (headWidth / 2)},${baseY + py * (headWidth / 2)} ` +
          `${baseX - px * (headWidth / 2)},${baseY - py * (headWidth / 2)}`
        );
        head.setAttribute('fill', color);
        head.setAttribute('opacity', arrowAlpha);
        svg.appendChild(head);
      });
    }
  }
  gridEl.appendChild(svg);
}

function handleCellClick(r, c) {
  // 橡皮擦开关优先：开着就擦，关掉后完全按原来的工具走
  if (eraserOn || currentTool === 'eraser') {
    eraserAt(r, c);
    return;
  }

  if (currentLayer === 'arrow') {
    if (!currentTool.startsWith('arrow-')) return;

    if (!arrowStart) {
      arrowStart = { r, c };
      updateCell(r, c);                       // 只更新起点高亮
      return;
    }

    if (arrowStart.r === r && arrowStart.c === c) return;   // 同格，忽略

    const arrow = { color: currentTool, toR: r, toC: c };
    gridData[arrowStart.r][arrowStart.c].arrows.push(arrow);
    indexAddArrow(arrowStart.r, arrowStart.c, arrow);

    const prev = arrowStart;
    arrowStart = null;
    updateCell(prev.r, prev.c);               // 清掉旧起点高亮
    pushHistory();
    repaintAll();                             // 箭头层整体重画
    return;
  }

  if (currentTool.startsWith('arrow-')) return;
  if (gridData[r][c].ground === currentTool) return;

  // 被浮动格碰到的格子：不能放图标（箭头不受影响，见上面分支）
  if (!canPlaceIcon(r, c)) {
    showToast('这里被浮动格占用了，不能放图标（箭头可以）', 1800);
    return;
  }

  gridData[r][c].ground = currentTool;

  if (document.getElementById('baseEnable').checked) {
    gridData[r][c].base = +document.getElementById('baseLevel').value;
  }
  groundOverflow[cellKey(r, c)] = {
    ground: gridData[r][c].ground,
    base: gridData[r][c].base
  };

  pushHistory();
  updateCell(r, c);                           // 单格重绘，不再重建全图
}

function pushHistory() {
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.stringify({ gridData, groundOverflow, baseLines, midCells }));

  // 环形缓冲：超出上限时丢掉最老的快照
  if (history.length > HISTORY_LIMIT) {
    history.splice(0, history.length - HISTORY_LIMIT);
  }
  historyIndex = history.length - 1;

  scheduleAutoSave();
}

/* ===== 自动保存到 localStorage ===== */
const AUTOSAVE_KEY = 'map-editor:autosave:v1';
const AUTOSAVE_DELAY = 800;           // 停手 800ms 后才写
const AUTOSAVE_MAX_BYTES = 4.5 * 1024 * 1024;   // 接近 5MB 配额就停用

let autoSaveTimer = null;
let autoSaveDisabled = false;         // 一旦因配额/无痕不可用，本次会话不再尝试
let autoSaveWarned = false;
let lastSavedAt = 0;

/* 探测 localStorage 是否真的可用（无痕模式、禁用 Cookie 都会抛异常） */
function storageAvailable() {
  try {
    const k = '__probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

const STORAGE_OK = storageAvailable();

function scheduleAutoSave() {
  if (autoSaveDisabled || !STORAGE_OK) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(doAutoSave, AUTOSAVE_DELAY);
}

function doAutoSave() {
  autoSaveTimer = null;
  if (autoSaveDisabled || !STORAGE_OK) return;

  let payload;
  try {
    payload = JSON.stringify({
      v: 1, savedAt: Date.now(), cols, rows, gridData, groundOverflow, baseLines, midCells
    });
  } catch (e) {
    return;                                  // 序列化失败就跳过，不影响编辑
  }

  // 大图保护：超过配额上限就停用，只提示一次
  if (payload.length > AUTOSAVE_MAX_BYTES) {
    autoSaveDisabled = true;
    if (!autoSaveWarned) {
      autoSaveWarned = true;
      showToast('地图太大，自动保存已停用（请用「导出 JSON」手动备份）', 4200);
    }
    return;
  }

  try {
    window.localStorage.setItem(AUTOSAVE_KEY, payload);
    lastSavedAt = Date.now();
  } catch (e) {
    // QuotaExceededError 等：停用并提示一次
    autoSaveDisabled = true;
    if (!autoSaveWarned) {
      autoSaveWarned = true;
      showToast('浏览器存储空间不足，自动保存已停用', 4200);
    }
  }
}

/* 页面关闭前尽力保存一次，避免"停手不到 800ms 就关掉"丢改动 */
window.addEventListener('beforeunload', () => {
  if (autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
    doAutoSave();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && autoSaveTimer) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
    doAutoSave();
  }
});

/* 读取存档；返回是否成功恢复 */
function loadAutoSave() {
  if (!STORAGE_OK) return false;
  let raw;
  try { raw = window.localStorage.getItem(AUTOSAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;

  try {
    const d = JSON.parse(raw);
    const cells = d && (d.cells || d.gridData);   // 兼容导出格式(cells)与存档格式(gridData)
    if (!d || !Number.isInteger(d.cols) || !Number.isInteger(d.rows)
        || d.cols < 1 || d.rows < 1 || d.cols > 200 || d.rows > 200
        || !Array.isArray(cells) || cells.length !== d.rows) return false;

    // 与导入同样做一次结构归一化，坏数据不至于让编辑器崩掉
    const normalized = [];
    for (let r = 0; r < d.rows; r++) {
      const srcRow = cells[r];
      if (!Array.isArray(srcRow) || srcRow.length !== d.cols) return false;
      const row = [];
      for (let c = 0; c < d.cols; c++) {
        const src = srcRow[c];
        const cell = (src && typeof src === 'object') ? src : {};
        row.push({
          ground: (typeof cell.ground === 'string' && cell.ground) ? cell.ground : 'empty',
          base: (typeof cell.base === 'number' && isFinite(cell.base)) ? cell.base : null,
          arrows: Array.isArray(cell.arrows) ? cell.arrows.slice() : []
        });
      }
      normalized.push(row);
    }

    // 清洗箭头
    for (let r = 0; r < d.rows; r++) {
      for (let c = 0; c < d.cols; c++) {
        normalized[r][c].arrows = normalized[r][c].arrows.filter(a =>
          a && a.toR !== undefined && a.toC !== undefined
          && a.toR >= 0 && a.toR < d.rows && a.toC >= 0 && a.toC < d.cols
          && (a.toR !== r || a.toC !== c)
        );
      }
    }

    cols = d.cols;
    rows = d.rows;
    gridData = normalized;
    groundOverflow = (d.groundOverflow && typeof d.groundOverflow === 'object')
      ? d.groundOverflow : {};
    baseLines = normalizeBaseLines(d.baseLines);
    midCells = (d.midCells && typeof d.midCells === 'object') ? d.midCells : {};

    arrowStart = null;
    rebuildArrowIndex();

    document.getElementById('colsInput').value = cols;
    document.getElementById('rowsInput').value = rows;

    history = [JSON.stringify({ gridData, groundOverflow, baseLines, midCells })];
    historyIndex = 0;
    lastSavedAt = d.savedAt || Date.now();
    return true;
  } catch (e) {
    return false;
  }
}

function hasAutoSave() {
  if (!STORAGE_OK) return false;
  try { return !!window.localStorage.getItem(AUTOSAVE_KEY); } catch (e) { return false; }
}

function clearAutoSave(silent) {
  if (!STORAGE_OK) return;
  try {
    window.localStorage.removeItem(AUTOSAVE_KEY);
    lastSavedAt = 0;
    if (!silent) showToast('已清除自动保存');
  } catch (e) { /* 忽略 */ }
}

/* ===== 清除自动保存：复用现有确认框 ===== */
let confirmAction = null;          // null = 清空地图；函数 = 自定义动作

function onClearSaveClick() {
  if (!hasAutoSave()) { showToast('当前没有自动保存的存档'); return; }
  confirmAction = () => {
    clearAutoSave(false);
    autoSaveDisabled = false;      // 手动清过之后，允许重新开始保存
    autoSaveWarned = false;
  };
  document.getElementById('confirmText').textContent = '确定清除浏览器里的自动保存？此操作不影响当前正在编辑的地图。';
  document.getElementById('confirmOkBtn').textContent = '清除';
  document.getElementById('confirmModal').classList.add('show');
}
function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    const s = JSON.parse(history[historyIndex]);
    gridData = s.gridData;
    groundOverflow = s.groundOverflow;
    midCells = s.midCells || {};
    baseLines = s.baseLines || [];
    arrowStart = null;
    clearSelection();
    rebuildArrowIndex();
    renderGrid();
  }
}
function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    const s = JSON.parse(history[historyIndex]);
    gridData = s.gridData;
    groundOverflow = s.groundOverflow;
    midCells = s.midCells || {};
    baseLines = s.baseLines || [];
    arrowStart = null;
    clearSelection();
    rebuildArrowIndex();
    renderGrid();
  }
}
document.addEventListener('keydown', (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  const key = e.key.toLowerCase();
  if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});

function resizeGrid() {
  const newCols = +document.getElementById('colsInput').value;
  const newRows = +document.getElementById('rowsInput').value;
  if (newCols < 1 || newCols > 200 || newRows < 1 || newRows > 200) {
    showToast('长和宽的范围都是 1–200');
    return;
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const g = gridData[r][c].ground;
      const b = gridData[r][c].base;
      if ((g && g !== 'empty') || (b !== null && b !== undefined)) {
        groundOverflow[`${r},${c}`] = { ground: g, base: b };
      }
    }
  }

  const newData = [];
  for (let r = 0; r < newRows; r++) {
    const row = [];
    for (let c = 0; c < newCols; c++) {
      const key = `${r},${c}`;
      let ground = 'empty';
      let base = null;

      if (groundOverflow[key]) {
        ground = groundOverflow[key].ground || 'empty';
        base = (groundOverflow[key].base !== undefined) ? groundOverflow[key].base : null;
      } else if (r < rows && c < cols) {
        ground = gridData[r][c].ground;
        base = gridData[r][c].base;
      }

      let arrows = [];
      if (r < rows && c < cols) {
        arrows = gridData[r][c].arrows
          .filter(a => a.toR < newRows && a.toC < newCols)
          .slice();
      }

      row.push({ ground, base, arrows });
    }
    newData.push(row);
  }

  cols = newCols;
  rows = newRows;
  gridData = newData;
  arrowStart = null;
  rebuildArrowIndex();
  pushHistory();
  renderGrid();
}

function clearGrid() {
  confirmAction = null;            // 清空地图
  document.getElementById('confirmText').textContent = '确定清空地图？';
  document.getElementById('confirmOkBtn').textContent = '清空';
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmAction = null;
}
function confirmClear() {
  if (confirmAction) {
    const fn = confirmAction;
    closeConfirm();
    fn();
    return;
  }
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      gridData[r][c] = { ground: 'empty', base: null, arrows: [] };
  groundOverflow = {};
  baseLines = [];
  midCells = {};
  altStart = null;
  arrowStart = null;
  rebuildArrowIndex();
  pushHistory();
  renderGrid();
  closeConfirm();
}

function exportJSON() {
  const data = { cols, rows, cells: gridData, groundOverflow, baseLines, midCells };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'map.json'; a.click();
  URL.revokeObjectURL(url);
}
function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);

      // 校验：行列必须是正整数，cells 必须是与行列匹配的二维数组
      if (!Number.isInteger(data.cols) || !Number.isInteger(data.rows)
          || data.cols < 1 || data.rows < 1
          || data.cols > 200 || data.rows > 200) {
        throw new Error('行列数必须是 1–200 的整数');
      }
      if (!Array.isArray(data.cells) || data.cells.length !== data.rows) {
        throw new Error('cells 与行数不匹配');
      }

      const normalized = [];
      for (let r = 0; r < data.rows; r++) {
        const srcRow = data.cells[r];
        if (!Array.isArray(srcRow) || srcRow.length !== data.cols) {
          throw new Error(`第 ${r + 1} 行的列数与 cols 不匹配`);
        }
        const row = [];
        for (let c = 0; c < data.cols; c++) {
          const src = srcRow[c];
          const cell = (src && typeof src === 'object') ? src : {};
          row.push({
            ground: (typeof cell.ground === 'string' && cell.ground) ? cell.ground : 'empty',
            base: (typeof cell.base === 'number' && isFinite(cell.base)) ? cell.base : null,
            arrows: Array.isArray(cell.arrows) ? cell.arrows.slice() : []
          });
        }
        normalized.push(row);
      }

      cols = data.cols;
      rows = data.rows;
      gridData = normalized;

      groundOverflow = (data.groundOverflow && typeof data.groundOverflow === 'object')
        ? data.groundOverflow : {};
      Object.keys(groundOverflow).forEach(k => {
        const v = groundOverflow[k];
        if (typeof v === 'string') {
          groundOverflow[k] = { ground: v, base: null };
        } else if (!v || typeof v !== 'object') {
          delete groundOverflow[k];
        }
      });
      baseLines = normalizeBaseLines(data.baseLines);
      midCells = (data.midCells && typeof data.midCells === 'object') ? data.midCells : {};

      // 兼容旧的 dir 写法
      const dirVec = {
        right: [0, 1], left: [0, -1], up: [-1, 0], down: [1, 0],
        'up-right': [-1, 1], 'up-left': [-1, -1],
        'down-right': [1, 1], 'down-left': [1, -1]
      };
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = gridData[r][c];
          cell.arrows.forEach(a => {
            if (a && a.toR === undefined && a.dir) {
              const [dr, dc] = dirVec[a.dir] || [0, 1];
              a.toR = r + dr; a.toC = c + dc;
            }
          });
          // 丢弃越界或残缺的箭头，避免渲染期出现 undefined 颜色
          cell.arrows = cell.arrows.filter(a =>
            a && a.toR !== undefined && a.toC !== undefined
            && a.toR >= 0 && a.toR < rows && a.toC >= 0 && a.toC < cols
            && (a.toR !== r || a.toC !== c)
          );
        }
      }

      arrowStart = null;
      document.getElementById('colsInput').value = cols;
      document.getElementById('rowsInput').value = rows;
      rebuildArrowIndex();
      history = [JSON.stringify({ gridData, groundOverflow, baseLines, midCells })];
      historyIndex = 0;
      renderGrid();
      scheduleAutoSave();
      showToast('导入成功');
    } catch (err) {
      showToast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function exportPNG(mode) {
  document.getElementById('exportMenu').classList.remove('show');

  const withGap = (mode === 'grid');
  const arrowAlpha = document.getElementById('exportArrowAlpha').checked ? 0.85 : 1;

  const step = CELL_SIZE + GAP;
  const totalW = withGap
    ? cols * CELL_SIZE + (cols - 1) * GAP
    : cols * CELL_SIZE;
  const totalH = withGap
    ? rows * CELL_SIZE + (rows - 1) * GAP
    : rows * CELL_SIZE;

  const usedIcons = new Set();
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const g = gridData[r][c].ground;
      if (g && g !== 'empty' && !NO_IMAGE_ICONS.has(g)) usedIcons.add(g);
    }
  // 浮动格里的图标也要一起加载
  Object.values(midCells).forEach(mc => {
    const g = mc && mc.ground;
    if (g && g !== 'empty' && !NO_IMAGE_ICONS.has(g)) usedIcons.add(g);
  });

  const imgMap = {};
  await Promise.all([...usedIcons].map(id => new Promise(resolve => {
    const file = ICON_FILE_MAP[id];
    if (!file) { resolve(); return; }
    const img = new Image();
    img.onload = () => { imgMap[id] = img; resolve(); };
    img.onerror = () => resolve();
    img.src = ICONS_DIR + file + ICON_EXT;
  })));

  const dpr = window.devicePixelRatio || 1;
  const canvas = document.createElement('canvas');
  canvas.width = totalW * dpr;
  canvas.height = totalH * dpr;
  canvas.style.width = totalW + 'px';
  canvas.style.height = totalH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const colorMap = {
    'arrow-red': '#e53935', 'arrow-blue': '#1e88e5',
    'arrow-green': '#43a047', 'arrow-yellow': '#fbc02d'
  };

  ctx.fillStyle = withGap ? '#dddddd' : '#ffffff';
  ctx.fillRect(0, 0, totalW, totalH);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const data = gridData[r][c];

      if (data.base !== null && data.base !== undefined) {
        const v = Math.round(255 * (1 - data.base / 100));
        ctx.fillStyle = `rgb(${v},${v},${v})`;
      } else {
        ctx.fillStyle = '#ffffff';
      }

      if (withGap) {
        const x = c * step, y = r * step;
        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      } else {
        const x = c * CELL_SIZE, y = r * CELL_SIZE;
        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const data = gridData[r][c];
      const x = withGap ? c * step : c * CELL_SIZE;
      const y = withGap ? r * step : r * CELL_SIZE;
      if (data.ground && data.ground !== 'empty') {
        const img = imgMap[data.ground];
        if (img) ctx.drawImage(img, x, y, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  // ---- 斜带底板（画在逐格底板之上、图标之下）----
  //  坐标系按当前模式换算：带网格用 step（含 1px 间隙），不带网格用 CELL_SIZE
  const px = (n) => withGap ? n * step : n * CELL_SIZE;
  const hullOf = (list) => {
    const p = list.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) =>
      (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) {
      while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop();
      lo.push(q);
    }
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop();
      up.push(q);
    }
    lo.pop(); up.pop();
    return lo.concat(up);
  };

  baseLines.forEach(line => {
    if (line.r1 === line.r2 && line.c1 === line.c2) return;
    const bx0 = px(line.c1), by0 = px(line.r1);
    const bx1 = px(line.c2), by1 = px(line.r2);
    const pts = [
      [bx0, by0], [bx0 + CELL_SIZE, by0],
      [bx0 + CELL_SIZE, by0 + CELL_SIZE], [bx0, by0 + CELL_SIZE],
      [bx1, by1], [bx1 + CELL_SIZE, by1],
      [bx1 + CELL_SIZE, by1 + CELL_SIZE], [bx1, by1 + CELL_SIZE]
    ];
    const ring = hullOf(pts);
    if (ring.length < 3) return;

    const v = Math.round(255 * (1 - line.value / 100));
    ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    ctx.beginPath();
    ctx.moveTo(ring[0][0], ring[0][1]);
    for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i][0], ring[i][1]);
    ctx.closePath();
    ctx.fill();
  });

  // ---- 浮动格（含自身底板与图标，画在斜带之上）----
  baseLineMidCells().forEach(m => {
    const mx = withGap ? m.x : (m.x / step) * CELL_SIZE;
    const my = withGap ? m.y : (m.y / step) * CELL_SIZE;
    const content = midCells[m.lineIndex];

    if (content && content.base !== null && content.base !== undefined) {
      const v = Math.round(255 * (1 - content.base / 100));
      ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
      ctx.fillRect(mx, my, CELL_SIZE, CELL_SIZE);
    }
    if (content && content.ground && content.ground !== 'empty'
        && !NO_IMAGE_ICONS.has(content.ground)) {
      const im = imgMap[content.ground];
      if (im) ctx.drawImage(im, mx, my, CELL_SIZE, CELL_SIZE);
    }
  });

  const { lineWidth, headLen, headWidth } = ARROW_STYLE;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const data = gridData[r][c];
      if (!data.arrows || data.arrows.length === 0) continue;

      const cx = withGap ? c * step + CELL_SIZE/2 : c * CELL_SIZE + CELL_SIZE/2;
      const cy = withGap ? r * step + CELL_SIZE/2 : r * CELL_SIZE + CELL_SIZE/2;

      data.arrows.forEach(arrow => {
        if (arrow.toR === undefined || arrow.toC === undefined) return;
        const strokeColor = colorMap[arrow.color];
        if (!strokeColor) return;              // 与 SVG 渲染保持一致，避免画出黑色箭头
        const tx = withGap ? arrow.toC * step + CELL_SIZE/2 : arrow.toC * CELL_SIZE + CELL_SIZE/2;
        const ty = withGap ? arrow.toR * step + CELL_SIZE/2 : arrow.toR * CELL_SIZE + CELL_SIZE/2;

        const dx = tx - cx, dy = ty - cy;
        const dist = Math.hypot(dx, dy);
        if (dist < 1) return;
        const ux = dx / dist, uy = dy / dist;
        const lineEndX = tx - ux * (headLen * 0.5);
        const lineEndY = ty - uy * (headLen * 0.5);

        ctx.globalAlpha = arrowAlpha;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(lineEndX, lineEndY);
        ctx.stroke();

        const baseX = tx - ux * headLen;
        const baseY = ty - uy * headLen;
        const px = -uy, py = ux;
        ctx.fillStyle = strokeColor;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(baseX + px * (headWidth / 2), baseY + py * (headWidth / 2));
        ctx.lineTo(baseX - px * (headWidth / 2), baseY - py * (headWidth / 2));
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 1;
      });
    }
  }

  const fileName = mode === 'grid' ? 'map-grid.png' : 'map-nogrid.png';
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = fileName;
  a.click();
}

function toggleExportMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('exportMenu');
  menu.classList.toggle('show');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('exportMenu');
  if (!menu.classList.contains('show')) return;
  // 点在菜单内部不关闭；其余位置一律关闭
  if (e.target.closest && e.target.closest('.export-menu')) return;
  menu.classList.remove('show');
});

/* ===== 轻提示 ===== */
let toastTimer = null;
function showToast(msg, duration) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    toastTimer = null;
  }, duration || 2200);
}

document.getElementById('exportArrowAlpha').addEventListener('change', function() {
  document.getElementById('exportAlphaToggle').classList.toggle('active', this.checked);
  renderGrid();
});

function replayFade(el) {
  if (!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

document.querySelectorAll('.layer-btn').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.layer-btn').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentLayer = el.dataset.layer;
    arrowStart = null;

    const modeSwitch = document.getElementById('modeSwitch');
    const baseSetting = document.getElementById('baseSetting');

    if (currentLayer === 'ground') {
      document.getElementById('groundTools').style.display = 'block';
      document.getElementById('arrowTools').style.display = 'none';
      modeSwitch.classList.remove('disabled');
      baseSetting.classList.remove('disabled');
      setTool('safeguard');
      replayFade(document.getElementById('groundTools'));
    } else {
      document.getElementById('groundTools').style.display = 'none';
      document.getElementById('arrowTools').style.display = 'block';
      modeSwitch.classList.add('disabled');
      baseSetting.classList.add('disabled');
      setTool('arrow-red');
      replayFade(document.getElementById('arrowTools'));
    }
    renderGrid();
  };
});

document.querySelectorAll('.mode-btn').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentMode = el.dataset.mode;
    setTool('safeguard');
    renderIconGroups();
    renderGrid();
    replayFade(document.getElementById('groundTools'));
  };
});

function setTool(type) {
  currentTool = type;
  document.querySelectorAll('.icon-item').forEach(el => {
    el.classList.toggle('active', el.dataset.type === type);
  });
  document.querySelectorAll('.arrow-tool').forEach(el => {
    if (el.id === 'leftEraserBtn') return;   // 橡皮擦的高亮只由开关决定
    el.classList.toggle('active', el.dataset.type === type);
  });
}

document.querySelectorAll('.arrow-tool').forEach(el => {
  el.onclick = () => {
    setTool(el.dataset.type);
    arrowStart = null;
    renderGrid();
  };
});

/* 橡皮擦：单独的开关按钮。放在上面那个循环之后，
   覆盖掉通用处理，避免被当成普通"箭头工具"选中。 */
(function initEraserToggle() {
  const btn = document.getElementById('leftEraserBtn');
  if (!btn) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    toggleEraser();
  };
  updateEraserUI();
})();

const baseLevel = document.getElementById('baseLevel');
const baseLevelNum = document.getElementById('baseLevelNum');
const basePreview = document.getElementById('basePreview');

function updateBasePreview() {
  const v = +baseLevel.value;
  const g = Math.round(255 * (1 - v / 100));
  basePreview.style.background = `rgb(${g},${g},${g})`;

  if (baseLevelNum.value !== String(v)) {
    baseLevelNum.value = v;
  }
  baseLevelNum.classList.toggle('at-max', v >= 100);
}

baseLevel.addEventListener('input', () => {
  baseLevelNum.value = baseLevel.value;
  updateBasePreview();
  document.getElementById('baseEnable').checked = true;
});

baseLevel.addEventListener('wheel', (e) => {
  e.preventDefault();
  let v = +baseLevel.value || 0;
  const step = e.deltaY < 0 ? 1 : -1;
  v = Math.max(0, Math.min(100, v + step));
  baseLevel.value = v;
  baseLevelNum.value = v;
  updateBasePreview();
  document.getElementById('baseEnable').checked = true;
}, { passive: false });

baseLevelNum.addEventListener('input', () => {
  let v = +baseLevelNum.value;
  if (isNaN(v)) v = 0;
  if (v < 0) v = 0;
  if (v > 100) v = 100;
  baseLevelNum.value = v;
  baseLevel.value = v;
  updateBasePreview();
  document.getElementById('baseEnable').checked = true;
});

baseLevelNum.addEventListener('wheel', (e) => {
  e.preventDefault();
  let v = +baseLevelNum.value || 0;
  const step = e.deltaY < 0 ? 1 : -1;
  if (step === 1 && v >= 100) {
    baseLevelNum.classList.remove('shake');
    void baseLevelNum.offsetWidth;
    baseLevelNum.classList.add('shake');
    return;
  }
  v = Math.max(0, Math.min(100, v + step));
  baseLevelNum.value = v;
  baseLevel.value = v;
  updateBasePreview();
  document.getElementById('baseEnable').checked = true;
}, { passive: false });

updateBasePreview();

function initTickBar(tickId, inputId, maxVal, hintId, minVal) {
  const tickBar = document.getElementById(tickId);
  const input = document.getElementById(inputId);
  const hint = document.getElementById(hintId);
  const ticksEl = tickBar.querySelector('.ticks');

  const MIN_VAL = minVal !== undefined ? minVal : 1;
  const TOTAL_TICKS = Math.max((maxVal - MIN_VAL) * 2 + 10, 50);

  ticksEl.innerHTML = '';
  for (let i = 0; i < TOTAL_TICKS; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    ticksEl.appendChild(t);
  }

  const TICK_HEIGHT = 8;
  const BAR_HEIGHT = 30;

  function clamp(val) {
    if (val < MIN_VAL) return MIN_VAL;
    if (val > maxVal) return maxVal;
    return val;
  }
  function updateMaxStyle() {
    const val = +input.value || 0;
    if (val >= maxVal) {
      input.classList.add('at-max');
      hint.classList.add('show');
    } else {
      input.classList.remove('at-max');
      hint.classList.remove('show');
    }
  }
  function shake() {
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
  }
  function updateTicks() {
    let val = +input.value || 0;
    val = clamp(val);
    input.value = val;

    const offset = BAR_HEIGHT / 2 - (val * TICK_HEIGHT + TICK_HEIGHT / 2);
    ticksEl.style.transform = `translateY(${offset}px)`;
    updateMaxStyle();
  }

  input.addEventListener('wheel', function(e) {
    e.preventDefault();
    const step = e.deltaY < 0 ? 1 : -1;
    let val = +input.value || 0;
    if (step === 1 && val >= maxVal) { shake(); return; }
    input.value = clamp(val + step);
    updateTicks();
  }, { passive: false });

  input.addEventListener('input', function() {
    let val = +input.value || 0;
    input.value = clamp(val);
    updateTicks();
  });

  let dragging = false, startY = 0, startVal = 0;
  function onDown(e) {
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startVal = +input.value || 0;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = y - startY;
    let val = startVal - Math.round(dy / TICK_HEIGHT);
    val = clamp(val);
    input.value = val;
    updateTicks();
  }
  function onUp() { dragging = false; }

  tickBar.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  tickBar.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  updateTicks();
}

initTickBar('colsTick', 'colsInput', 200, 'colsHint', 1);
initTickBar('rowsTick', 'rowsInput', 200, 'rowsHint', 1);

/* 启动：有存档就恢复，否则用默认空图 */
initGrid(12, 12);
const restored = loadAutoSave();
renderIconGroups();
setTool('safeguard');
if (restored) {
  renderGrid();
  const t = lastSavedAt ? new Date(lastSavedAt) : null;
  const when = t
    ? `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`
    : '';
  showToast(`已恢复上次编辑${when ? '（' + when + '）' : ''}`, 2600);
  lastSavedAt = t ? lastSavedAt : 0;
} else if (!STORAGE_OK) {
  showToast('浏览器存储不可用，自动保存已关闭', 3200);
}

document.getElementById('modeSwitch').classList.remove('disabled');
document.getElementById('baseSetting').classList.remove('disabled');

/* 框选 / 整体拖动 */
initSelectionDrag();

/* ===== WASD / 方向键 / 小键盘 滚动地图区 ===== */
let isHoveringMap = false;
const gridWrapEl = document.getElementById('gridWrap');

gridWrapEl.addEventListener('mouseenter', () => { isHoveringMap = true; });
gridWrapEl.addEventListener('mouseleave', () => { isHoveringMap = false; });

const smoothStep = 80;
const holdSpeed = 14;

const keysHeld = { up: false, down: false, left: false, right: false };

function keyDirection(key, code) {
  if (key === 'w' || key === 'W' || key === 'ArrowUp' || code === 'Numpad8') return 'up';
  if (key === 's' || key === 'S' || key === 'ArrowDown' || code === 'Numpad2') return 'down';
  if (key === 'a' || key === 'A' || key === 'ArrowLeft' || code === 'Numpad4') return 'left';
  if (key === 'd' || key === 'D' || key === 'ArrowRight' || code === 'Numpad6') return 'right';
  return null;
}

document.addEventListener('keydown', (e) => {
  if (!isHoveringMap) return;
  const dir = keyDirection(e.key, e.code);
  if (!dir) return;
  e.preventDefault();

  if (!keysHeld[dir]) {
    const dx = dir === 'left' ? -smoothStep : dir === 'right' ? smoothStep : 0;
    const dy = dir === 'up' ? -smoothStep : dir === 'down' ? smoothStep : 0;
    gridWrapEl.scrollBy({ left: dx, top: dy, behavior: 'smooth' });
    keysHeld[dir] = true;
  }
});

document.addEventListener('keyup', (e) => {
  const dir = keyDirection(e.key, e.code);
  if (!dir) return;
  keysHeld[dir] = false;
});

/* 切窗口时 keyup / mouseleave 可能收不到，统一在这里复位，避免"松开键还在滚" */
function releaseAllKeys() {
  keysHeld.up = keysHeld.down = keysHeld.left = keysHeld.right = false;
  // Alt 松开时若只点了一个点，就在那一格铺底板（按你的选择）
  if (altStart) cancelAltStart(true);
}
window.addEventListener('blur', () => {
  releaseAllKeys();
  isHoveringMap = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { releaseAllKeys(); isHoveringMap = false; }
});

/* 单独监听 Alt 松开：只点了一个点的话，就在那一格铺底板 */
document.addEventListener('keyup', (e) => {
  if (e.key === 'Alt' && altStart) cancelAltStart(true);
});

function holdLoop() {
  let dx = 0, dy = 0;
  if (keysHeld.up) dy -= holdSpeed;
  if (keysHeld.down) dy += holdSpeed;
  if (keysHeld.left) dx -= holdSpeed;
  if (keysHeld.right) dx += holdSpeed;

  if (dx !== 0 || dy !== 0) {
    gridWrapEl.scrollBy({ left: dx, top: dy });
  }
  requestAnimationFrame(holdLoop);
}
requestAnimationFrame(holdLoop);
